         Mirrors applyEditorTheme in @petal/ui (default: system). -->

      try {
        var theme = localStorage.getItem('petal-editor-theme');
        if (theme === 'dark' || (theme !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)) {
