<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Petal: design React on a canvas, with your own coding agent</title>
    <meta name="description" content="Petal is a free desktop canvas for real React components. Design visually, work alongside Claude Code, Codex or Cursor, and hand off clean code. Runs on your machine, no account." />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)" />
    <meta property="og:title" content="Petal" />
    <meta property="og:description" content="Design with real React components. Free, local, bring your own agent." />
    <meta property="og:image" content="https://petal-design.vercel.app/hero-editor.webp" />
    <meta property="og:url" content="https://petal-design.vercel.app/" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.png" type="image/png" sizes="256x256" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preload" as="image" href="/hero-editor.webp" media="(min-width: 640px)" />
    <script>
      (function () {
        try {
          var t = localStorage.getItem('petal-theme');
          if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          document.documentElement.dataset.theme = t;
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
